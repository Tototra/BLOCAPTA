  steps:
  - id: brancardage_aller
    label: Service → bloc (brancard, fauteuil ou à pied)
    duration_min:
      dist: lognormal
      mean: 10
      sd: 4
    optional_resources:
      brancardier_service: 1.0
  - id: accueil_preanesthesie
    label: Accueil, vérifications et préparation en pré-anesthésie
    duration_min:
      dist: lognormal
      mean: 10
      sd: 5
    resources:
      poste_preanesthesie: 1
    carry:
    - poste_preanesthesie
  - id: installation
    label: Entrée en salle et installation sur la table
    duration_share: 0.1
    resources:
      salle_op: 1
      iade: 1
      brancardier_bloc: 1
    carry:
