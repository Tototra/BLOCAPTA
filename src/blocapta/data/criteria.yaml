# Critères minimum qu'une fiche technique éditeur doit respecter.
#
# severity :
#   bloquant -> la fiche est REJETÉE si le critère échoue (pas de simulation)
#   majeur   -> admis, mais signalé comme point de vigilance fort
#   mineur   -> information à compléter
#
# op disponibles : present, is_true, contains_any, in, gte, lte
# path : notation pointée ; "[]" aplatit une liste d'objets (ex. interoperabilite.connecteurs[].cible)
# when : condition optionnelle d'application du critère

version: 1
criteria:
  # --- Identification -------------------------------------------------------
  - id: ID-01
    category: identification
    label: Nom du produit et éditeur renseignés
    severity: bloquant
    all:
      - { path: produit.nom, op: present }
      - { path: produit.editeur, op: present }

  - id: ID-02
    category: identification
    label: Version du produit renseignée
    severity: mineur
    all:
      - { path: produit.version, op: present }

  # --- Réglementaire --------------------------------------------------------
  - id: REG-01
    category: reglementaire
    label: Hébergement des données de santé certifié HDS (ou installation sur site)
    severity: bloquant
    any:
      - { path: reglementaire.hebergement_hds, op: is_true }
      - { path: technique.hebergement, op: in, value: [on_premise] }

  - id: REG-02
    category: reglementaire
    label: Conformité RGPD déclarée
    severity: bloquant
    all:
      - { path: reglementaire.conformite_rgpd, op: is_true }

  - id: REG-03
    category: reglementaire
    label: Analyse d'impact (AIPD) disponible
    severity: majeur
    all:
      - { path: reglementaire.aipd_realisee, op: is_true }

  - id: REG-04
    category: reglementaire
    label: Marquage CE et classe précisés si dispositif médical
    severity: bloquant
    when: { path: reglementaire.dispositif_medical, op: is_true }
    all:
      - { path: reglementaire.marquage_ce, op: is_true }
      - { path: reglementaire.classe_dm, op: present }

  - id: REG-05
    category: reglementaire
    label: Gestion de l'Identité Nationale de Santé (INS)
    severity: majeur
    all:
      - { path: reglementaire.ins_compatible, op: is_true }

  - id: REG-06
    category: reglementaire
    label: Authentification Pro Santé Connect
    severity: mineur
    all:
      - { path: reglementaire.pro_sante_connect, op: is_true }

  # --- Interopérabilité -----------------------------------------------------
  - id: INT-01
    category: interoperabilite
    label: Au moins un standard d'interopérabilité de santé supporté
    severity: bloquant
    any:
      - { path: interoperabilite.standards, op: contains_any, value: [HL7v2, HL7 v2, FHIR, FHIR R4, DICOM, HPRIM, CDA] }
      - { path: "interoperabilite.connecteurs[].standard", op: contains_any, value: [HL7v2, HL7 v2, FHIR, FHIR R4, DICOM, HPRIM, CDA] }

  - id: INT-02
    category: interoperabilite
    label: Connecteurs décrits (application cible, standard, sens)
    severity: majeur
    all:
      - { path: interoperabilite.connecteurs, op: present }

  # --- Technique ------------------------------------------------------------
  - id: TEC-01
    category: technique
    label: Authentification unique (SSO / annuaire)
    severity: majeur
    all:
      - { path: technique.sso, op: is_true }

  - id: TEC-02
    category: technique
    label: Mode dégradé documenté
    severity: majeur
    all:
      - { path: technique.mode_degrade, op: is_true }

  - id: TEC-03
    category: technique
    label: Capacité en utilisateurs simultanés annoncée
    severity: majeur
    all:
      - { path: technique.utilisateurs_simultanes_max, op: present }

  - id: TEC-04
    category: technique
    label: Type de poste requis (fixe / mobile)
    severity: mineur
    all:
      - { path: technique.type_poste, op: present }

  - id: TEC-05
    category: technique
    label: Plage de disponibilité du service précisée
    severity: mineur
    all:
      - { path: technique.disponibilite_horaire, op: present }

  # --- Modèle métier (indispensable à la simulation) -------------------------
  - id: MET-01
    category: metier
    label: Rôles utilisateurs ciblés
    severity: bloquant
    any:
      - { path: metier.roles_cibles, op: present }
      - { path: "metier.points_de_contact[].roles", op: present }

  - id: MET-02
    category: metier
    label: Tâches prises en charge décrites (points de contact)
    severity: bloquant
    all:
      - { path: metier.points_de_contact, op: present }

  - id: MET-03
    category: metier
    label: Nombre maximal d'éléments par saisie précisé pour chaque tâche
    severity: majeur
    when: { path: metier.points_de_contact, op: present }
    all:
      - { path: "metier.points_de_contact[].elements_max_par_saisie", op: present, mode: each }

  - id: MET-04
    category: metier
    label: Temps de saisie moyen annoncé pour chaque tâche
    severity: mineur
    when: { path: metier.points_de_contact, op: present }
    all:
      - { path: "metier.points_de_contact[].duree_saisie_sec", op: present, mode: each }
