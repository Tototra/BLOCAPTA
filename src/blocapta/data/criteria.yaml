# Grille d'audit réglementaire et d'interopérabilité (document « INTEROPERABILITE », Drive BLOCAPTA).
# Cadre : ANS (CI-SIS, PGSSI-S), HAS, RGPD, NIS 2.
#
# severity :
#   bloquant -> « Obligatoire (Go/NoGo) » : sans cela, la DSI et le DPO refuseront l'installation
#   majeur   -> « Selon le périmètre » : fortement recommandé, contournable au démarrage
#   mineur   -> utile, secondaire pour un outil organisationnel
# Les critères « Pas nécessaire » (CE hors DM, HDS sur site, DICOM sans imagerie) sont
# portés par des conditions `when` : ils ne s'appliquent que si le cas d'usage le justifie.
#
# op : present, is_true, contains_any, in, gte, lte ; "[]" aplatit une liste d'objets.

version: 2
criteria:
  # --- 1. Obligatoire (Go/NoGo) ------------------------------------------------
  - id: GO-01
    category: protection des données
    label: Conformité RGPD et analyse d'impact (AIPD) réalisée avant déploiement
    severity: bloquant
    all:
      - { path: risques.contraintes_reglementaires.conformite_rgpd, op: is_true }
      - { path: risques.contraintes_reglementaires.aipd_realisee, op: is_true }

  - id: GO-02
    category: protection des données
    label: Hébergeur certifié HDS (logiciel hébergé hors de l'établissement)
    severity: bloquant
    when: { path: risques.contraintes_reglementaires.hebergement, op: in, value: [cloud_hds, saas, mixte] }
    all:
      - { path: risques.contraintes_reglementaires.hds_certifie, op: is_true }

  - id: GO-03
    category: cybersécurité
    label: Traçabilité infalsifiable des accès (qui, quand, quoi, sur quel dossier)
    severity: bloquant
    all:
      - { path: risques.contraintes_reglementaires.tracabilite_acces, op: is_true }

  - id: GO-04
    category: identitovigilance
    label: Identité Nationale de Santé (téléservice INSi) si dossiers patients nominatifs
    severity: bloquant
    when: { path: donnees.donnees_patient_nominatives, op: is_true }
    all:
      - { path: risques.contraintes_reglementaires.ins_integre, op: is_true }

  - id: GO-05
    category: cybersécurité
    label: Chiffrement des flux (TLS), droits par profil métier (RBAC) et matrice des flux
    severity: bloquant
    all:
      - { path: risques.contraintes_reglementaires.chiffrement_tls, op: is_true }
      - { path: risques.contraintes_reglementaires.gestion_droits_rbac, op: is_true }
      - { path: risques.contraintes_reglementaires.matrice_flux, op: is_true }

  - id: GO-06
    category: continuité
    label: Plan de continuité et de reprise (PCA/PRA, RPO et RTO définis)
    severity: bloquant
    all:
      - { path: risques.contraintes_reglementaires.pca_pra, op: is_true }

  - id: GO-07
    category: dispositif médical
    label: Marquage CE médical (RDM 2017/745) si fonction d'aide au diagnostic ou à la décision
    severity: bloquant
    when: { path: risques.contraintes_reglementaires.dispositif_medical, op: is_true }
    all:
      - { path: risques.contraintes_reglementaires.marquage_ce, op: is_true }

  # --- 2. Selon le périmètre ---------------------------------------------------
  - id: PER-01
    category: interopérabilité
    label: Standard d'échange de santé (HL7 v2, FHIR, CDA) pour les liens avec le SI
    severity: majeur
    when: { path: donnees.liens_logiciels, op: present }
    all:
      - { path: "donnees.liens_logiciels[].standard", op: contains_any, value: [HL7v2, HL7 v2, FHIR, CDA, HPRIM, DICOM] }

  - id: PER-02
    category: authentification
    label: Authentification unique (annuaire / SSO) ou Pro Santé Connect
    severity: majeur
    any:
      - { path: risques.contraintes_reglementaires.sso, op: is_true }
      - { path: risques.contraintes_reglementaires.pro_sante_connect, op: is_true }

  - id: PER-03
    category: cybersécurité
    label: Rapport de test d'intrusion récent et plan de correctifs
    severity: majeur
    all:
      - { path: risques.contraintes_reglementaires.pentest_recent, op: is_true }

  - id: PER-04
    category: interopérabilité
    label: DICOM si le logiciel traite de l'imagerie
    severity: majeur
    when: { path: risques.contraintes_reglementaires.traite_imagerie, op: is_true }
    all:
      - { path: risques.contraintes_reglementaires.dicom, op: is_true }

  - id: PER-05
    category: services socles
    label: Mon espace santé (DMP) / MSSanté si documents partagés avec le patient ou la ville
    severity: mineur
    when: { path: risques.contraintes_reglementaires.dmp_mssante, op: present }
    all:
      - { path: risques.contraintes_reglementaires.dmp_mssante, op: is_true }
