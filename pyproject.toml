[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "blocapta"
version = "0.1.0"
description = "Jumeau numérique hospitalier pour auditer la compatibilité d'un logiciel avant son déploiement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Thomas Trahant" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "simpy>=4.1",
    "httpx>=0.27",
    "jsonpatch>=1.33",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
blocapta = "blocapta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blocapta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
